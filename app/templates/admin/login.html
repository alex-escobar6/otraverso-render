<div class="login-wrap">
  <form class="login-card" method="post" action="/admin/login">
    <span class="eyebrow">Acceso restringido</span>
    <h1>OTRAVERSO Admin</h1>
    <p class="hint">Panel de administración de la tienda.</p>
    $ERROR
    <input type="hidden" name="csrf" value="$CSRF">
    <div class="field"><label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required autocomplete="username"></div>
    <div class="field"><label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
    <p style="margin-top:1rem"><a class="btn btn-ghost btn-block" href="/">Volver al sitio</a></p>
  </form>
</div>
