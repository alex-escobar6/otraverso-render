<div class="panel">
  <h2>Banners del inicio</h2>
  <div class="table-wrap"><table><thead><tr><th>Título</th><th>Subtítulo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>$BANNERS</tbody></table></div>
  <h3 style="margin-top:1rem">Nuevo banner</h3>
  <form class="form-grid" method="post" action="/admin/marketing/banners" enctype="multipart/form-data">
    $CSRF
    <div class="field"><label>Título</label><input name="title" required></div>
    <div class="field"><label>Subtítulo</label><input name="subtitle"></div>
    <div class="field"><label>Enlace</label><input name="link" value="/shop/catalogo"></div>
    <div class="field"><label>Orden</label><input name="sort_order" type="number" value="0"></div>
    <div class="field full"><label>Imagen</label><input type="file" name="image" accept="image/*"></div>
    <div class="field full"><button class="btn btn-primary" type="submit">Crear banner</button></div>
  </form>
</div>

<div class="panel"><h2>Promociones</h2>
  <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Descuento</th><th>Vigencia</th><th></th></tr></thead><tbody>$PROMOTIONS</tbody></table></div>
  <h3 style="margin-top:1rem">Nueva promoción</h3>
  <form class="form-grid" method="post" action="/admin/marketing/promotions">
    $CSRF
    <div class="field"><label>Nombre</label><input name="name" required></div>
    <div class="field"><label>Descuento (%)</label><input name="discount_percent" type="number" min="0" max="100" value="0"></div>
    <div class="field full"><label>Descripción</label><input name="description"></div>
    <div class="field"><label>Desde</label><input name="starts_at" type="date"></div>
    <div class="field"><label>Hasta</label><input name="ends_at" type="date"></div>
    <div class="field full"><button class="btn btn-primary" type="submit">Crear promoción</button></div>
  </form>
</div>

<div class="panel"><h2>Cupones</h2>
  <div class="table-wrap"><table><thead><tr><th>Código</th><th>Valor</th><th>Usos</th><th></th></tr></thead><tbody>$COUPONS</tbody></table></div>
  <h3 style="margin-top:1rem">Nuevo cupón</h3>
  <form class="form-grid" method="post" action="/admin/marketing/coupons">
    $CSRF
    <div class="field"><label>Código</label><input name="code" required></div>
    <div class="field"><label>Valor (COP)</label><input name="value" type="number" min="0" value="0"></div>
    <div class="field"><label>Usos máximos</label><input name="max_uses" type="number" min="1" value="1"></div>
    <div class="field"><label>Vence</label><input name="expires_at" type="date"></div>
    <div class="field full"><label>Descripción</label><input name="description"></div>
    <div class="field full"><button class="btn btn-primary" type="submit">Crear cupón</button></div>
  </form>
</div>

<div class="panel"><h2>Secciones del inicio de la tienda</h2>
  <form method="post" action="/admin/marketing/sections">
    $CSRF
    <table><thead><tr><th>Sección</th><th>Visible</th><th>Orden</th></tr></thead><tbody>$SECTIONS</tbody></table>
    <button class="btn btn-primary" type="submit" style="margin-top:1rem">Guardar secciones</button>
  </form>
</div>
