<div class="panel">
  <div class="admin-tabs">
    <a class="active" href="/admin/products">Productos</a>
    <a href="#categorias">Categorías</a>
    <a href="#proveedores">Proveedores</a>
    <a class="btn btn-primary btn-sm" href="/admin/products/new">Nuevo producto</a>
  </div>
  <form class="form-grid" method="get" action="/admin/products">
    <div class="field"><label>Buscar</label><input name="q" value="$SEARCH" placeholder="Nombre del producto"></div>
    <div class="field"><label>Estado</label><select name="status"><option value="">Todos</option><option value="active">Activo</option><option value="draft">Borrador</option><option value="archived">Archivado</option></select></div>
    <div class="field"><label>Modalidad</label><select name="modality"><option value="">Todas</option><option value="stock">Inventario</option><option value="order">Bajo pedido</option></select></div>
    <div class="field" style="align-self:end"><button class="btn btn-primary" type="submit">Filtrar</button></div>
  </form>
  <div class="table-wrap"><table>
    <thead><tr><th>Producto</th><th>Categoría</th><th>Modalidad</th><th>Precio</th><th>Stock</th><th>Imgs</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>$ROWS</tbody>
  </table></div>
</div>

<div class="panel" id="categorias">
  <h2>Categorías</h2>
  <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Slug</th><th>Acciones</th></tr></thead><tbody>$CATEGORY_ROWS</tbody></table></div>
  <h3 style="margin-top:1.2rem">Nueva categoría</h3>
  <form class="form-grid" method="post" action="/admin/categories">
    $CSRF
    <div class="field"><label>Nombre</label><input name="name" required></div>
    <div class="field"><label>Slug (opcional)</label><input name="slug"></div>
    <div class="field full"><label>Descripción</label><input name="description"></div>
    <div class="field"><label>SEO título</label><input name="seo_title"></div>
    <div class="field"><label>SEO descripción</label><input name="seo_description"></div>
    <div class="field"><label>Categoría padre (ID)</label><input name="parent_id" type="number" min="1"></div>
    <div class="field"><label>Orden</label><input name="sort_order" type="number" value="0"></div>
    <div class="field full"><button class="btn btn-primary" type="submit">Crear categoría</button></div>
  </form>
</div>

<div class="panel" id="proveedores">
  <h2>Proveedores</h2>
  <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Contacto</th><th>Enlace</th></tr></thead><tbody>$SUPPLIER_ROWS</tbody></table></div>
  <h3 style="margin-top:1.2rem">Nuevo proveedor</h3>
  <form class="form-grid" method="post" action="/admin/suppliers">
    $CSRF
    <div class="field"><label>Nombre</label><input name="name" required></div>
    <div class="field"><label>Contacto</label><input name="contact"></div>
    <div class="field full"><label>Enlace</label><input name="url" type="url" placeholder="https://..."></div>
    <div class="field full"><label>Notas</label><textarea name="notes" rows="2"></textarea></div>
    <div class="field full"><button class="btn btn-primary" type="submit">Registrar proveedor</button></div>
  </form>
</div>
