<div class="universe-ui universe-game-ui">
  <a class="universe-play-return" href="/play" data-warp data-play-back>← REGRESAR A PLAY</a>
  <canvas class="universe-game-canvas" data-game-canvas aria-hidden="true"></canvas>
  <div class="universe-game-panel" aria-live="off">
    <div class="universe-hud-row">
      <div class="universe-hud-item"><span>Velocidad</span><strong data-hud-speed>0 km/h</strong></div>
      <div class="universe-hud-item"><span>Tiempo</span><strong data-hud-time>95.0 / 95s</strong></div>
      <div class="universe-hud-item"><span>Puntos</span><strong data-hud-score>0</strong></div>
      <div class="universe-hud-item">
        <span>Turbo</span><div class="universe-meter"><span data-hud-turbo style="width:100%"></span></div>
        <span>Energía</span><div class="universe-meter universe-meter--energy"><span data-hud-energy style="width:100%"></span></div>
      </div>
    </div>
    <div class="universe-progress"><span data-hud-progress></span></div>
  </div>
  <p class="universe-game-label">Flechas / WASD · Espacio turbo · Shift salto · P pausa · R reiniciar · Esc salir</p>
  <div class="universe-countdown" data-game-countdown>3</div>
  <div class="universe-touch-controls" aria-label="Controles táctiles">
    <div class="universe-touch-group">
      <button class="universe-touch" type="button" data-touch-left aria-label="Girar a la izquierda">◀</button>
      <button class="universe-touch" type="button" data-touch-right aria-label="Girar a la derecha">▶</button>
    </div>
    <div class="universe-touch-group">
      <button class="universe-touch" type="button" data-touch-jump aria-label="Saltar">SALTO</button>
      <button class="universe-touch universe-touch--boost" type="button" data-touch-boost aria-label="Turbo">TURBO</button>
    </div>
  </div>
  <div class="universe-paused" data-game-paused hidden>
    <div class="universe-result__card"><h2>PAUSA</h2><p>Pulsa P para continuar.</p></div>
  </div>
  <div class="universe-result" data-game-result hidden role="dialog" aria-modal="true" aria-labelledby="resultado-titulo">
    <div class="universe-result__card">
      <h2 id="resultado-titulo" data-result-title>CIRCUITO COMPLETADO</h2>
      <div class="universe-result__stats">
        <div><span>Puntos</span><strong data-result-score>0</strong></div>
        <div><span>Tiempo</span><strong data-result-time>0.0 s</strong></div>
        <div><span>Récord</span><strong data-result-best>—</strong></div>
      </div>
      <div class="universe-result__actions">
        <button class="universe-result-button" type="button" data-retry>REINTENTAR</button>
        <button class="universe-result-button" type="button" data-circuit-menu>REGRESAR A PLAY</button>
        <button class="universe-result-button" type="button" data-game-hub>NEXO</button>
      </div>
    </div>
  </div>
</div>
