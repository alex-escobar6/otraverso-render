<section class="universe-stage" data-universe-root data-scene="$SCENE" data-panel="$PANEL" data-circuit="$CIRCUIT" data-game-code="$GAME_CODE" data-game-registry="$GAME_REGISTRY" data-play-csrf="$PLAY_CSRF" id="nexo-play" aria-label="Universo OTRAVERSO PLAY">
  <div class="universe-scene universe-scene--play" aria-hidden="true">
    <svg class="universe-sky" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="play-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#04040f"/>
          <stop offset="0.45" stop-color="#1a0b35"/>
          <stop offset="0.7" stop-color="#3b1255"/>
          <stop offset="1" stop-color="#06040f"/>
        </linearGradient>
        <radialGradient id="play-glow" cx="50%" cy="58%" r="50%">
          <stop offset="0" stop-color="#f472b6" stop-opacity="0.42"/>
          <stop offset="0.5" stop-color="#7c3aed" stop-opacity="0.16"/>
          <stop offset="1" stop-color="#06040f" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#play-sky)"/>
      <ellipse cx="800" cy="540" rx="700" ry="340" fill="url(#play-glow)"/>
      <g class="universe-stars">
        <circle cx="170" cy="110" r="1.4"/><circle cx="360" cy="210" r="1"/><circle cx="540" cy="80" r="1.6"/>
        <circle cx="880" cy="140" r="1.2"/><circle cx="1120" cy="90" r="1.5"/><circle cx="1390" cy="190" r="1"/>
      </g>
      <path class="universe-horizon" d="M0 700 Q400 650 800 700 T1600 700 V900 H0Z"/>
    </svg>
    <div class="universe-grid"></div>
  </div>

  <div class="universe-warp" data-warp-overlay aria-hidden="true"></div>

  <div class="universe-boot" data-loader aria-hidden="true"><span></span> NEXO ESTABLECIDO</div>
  <div class="universe-error" data-universe-error hidden role="alert">
    <span data-error-text>No se pudo iniciar la experiencia.</span>
    <button type="button" data-error-retry>Reintentar</button>
  </div>

  <div class="universe-ui universe-play-ui">
    $HUB_UI
    <nav class="universe-game-index universe-game-index--hub" aria-label="Catálogo de juegos PLAY">$GAME_INDEX</nav>
  </div>

  $PROFILE_UI

  $GAME_UI

  <div class="universe-toast" data-universe-toast role="status" aria-live="polite"></div>
</section>

<noscript>
  <section class="section">
    <div class="container pages-content">
      <h2>OTRAVERSO PLAY</h2>
      <p>OTRAVERSO PLAY requiere JavaScript. Vuelve al <a href="/">nexo dimensional</a>, entra a <a href="/shop">SHOP</a> o abre el <a href="/play/gravity">portal GRAVITY</a>.</p>
    </div>
  </section>
</noscript>
