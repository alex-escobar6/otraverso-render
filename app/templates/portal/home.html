<section class="galaxy-stage" id="galaxia" aria-label="Explorador de universos OTRAVERSO">
  <canvas class="galaxy-canvas" aria-hidden="true"></canvas>
  <div class="galaxy-atmosphere" aria-hidden="true"></div>
  <div class="galaxy-flash" aria-hidden="true"></div>

  <div class="galaxy-ui">
    <header class="galaxy-intro">
      <p class="galaxy-eyebrow"><span></span> OTRAVERSO · SISTEMA MULTIVERSAL</p>
      <h1>NO EXISTE UN SOLO UNIVERSO.<br><strong>EXPLORA LOS DEMÁS.</strong></h1>
      <p class="galaxy-lead">$HERO_TITLE</p>
      <p class="galaxy-sub">$HERO_SUBTITLE</p>
      <div class="galaxy-actions">
        <a class="galaxy-primary" href="/shop" data-warp>ENTRAR A SHOP <i aria-hidden="true">↗</i></a>
        <a class="galaxy-secondary" href="#indice-universos">VER UNIVERSOS <i aria-hidden="true">↓</i></a>
      </div>
      <p class="galaxy-hint">Mueve el cursor para explorar la galaxia · Selecciona un mundo</p>
    </header>

    <div class="galaxy-worlds">$WORLD_NODES</div>

    <nav class="galaxy-index" id="indice-universos" aria-label="Índice de universos">
      <span class="galaxy-index__label">UNIVERSOS</span>
      $GALAXY_INDEX
    </nav>
  </div>
</section>

$WORLD_DIALOGS
