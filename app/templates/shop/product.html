<section class="container">
  <nav class="hint" style="padding-top:1rem"><a href="/shop">Tienda</a> / <a href="/shop/catalogo">Catálogo</a> / $NAME</nav>
  <div class="product-detail">
    <div>
      <div class="gallery-main">$IMAGE</div>
      $THUMBS
    </div>
    <div class="detail-info">
      <div class="detail-tags">$BADGES $TAGS</div>
      <h1>$NAME</h1>
      <p>$SHORT</p>
      <div><span class="detail-price">$PRICE</span> $OLD_PRICE</div>
      <div class="notice stock" style="margin-top:1rem"><strong>$SHORT_DELIVERY</strong></div>
      $AVAILABILITY
      <div class="detail-box"><h3>Categoría</h3><p>$CATEGORY</p></div>
      <div class="detail-box"><h3>Variantes</h3><div class="variant-list">$VARIANTS</div></div>
      <div class="detail-box"><h3>Características</h3><table class="spec-table">$SPECS</table></div>
      <div class="detail-box"><h3>Descripción</h3><p>$DESCRIPTION</p></div>
      $FORM
      <p class="hint" style="margin-top:.8rem">$TERMS_NOTE</p>
    </div>
  </div>
  <div class="section-head"><div><span class="eyebrow">También te puede interesar</span><h2>Productos relacionados</h2></div></div>
  $RELATED
</section>
